# Generate the Xcode project with:  brew install xcodegen && xcodegen
name: Altiro
options:
  bundleIdPrefix: dev.altiro
  deploymentTarget:
    iOS: "18.0"
targets:
  Altiro:
    type: application
    platform: iOS
    sources:
      - Altiro
      # Wire format and crypto, shared with the Mac tool (one copy, so they can't drift).
      - path: ../mac/Sources/AltiroCore/Wire.swift
      # How the connection state looks, shared with the Mac app.
      - path: ../mac/Sources/AltiroCore/LinkState.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.altiro.phone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        # Set your team in Xcode (Signing & Capabilities) or here:
        DEVELOPMENT_TEAM: 9DVD654W58
        CODE_SIGN_STYLE: Automatic
    info:
      path: Altiro/Info.plist
      properties:
        CFBundleDisplayName: Altiro
        UILaunchScreen: {}
        # Shown in the Bluetooth permission prompt. It says why Altiro uses Bluetooth in the
        # background, which App Review checks against the bluetooth-central background mode.
        NSBluetoothAlwaysUsageDescription: Altiro connects to your Mac over Bluetooth to receive its notifications, including while Altiro is in the background, so they reach your iPhone when the app isn't open.
        # Receiving the Mac's notifications in the background is the app's core feature
        # (see docs/app-review-notes.md).
        UIBackgroundModes: [bluetooth-central]
        # Export compliance: the only encryption is Apple's own CryptoKit (part of iOS), used to
        # protect the user's notifications between their own devices. App Store Connect treats
        # encryption within Apple's operating system as exempt. Confirm this when submitting.
        ITSAppUsesNonExemptEncryption: false
