# The Altiro menu bar app. Generate the Xcode project with:  xcodegen  (in this folder)
name: AltiroMac
options:
  deploymentTarget:
    macOS: "14.0"
packages:
  AltiroCore:
    path: ..
targets:
  AltiroMac:
    type: application
    platform: macOS
    sources: [AltiroMac]
    dependencies:
      - package: AltiroCore
    settings:
      base:
        PRODUCT_NAME: Altiro
        PRODUCT_BUNDLE_IDENTIFIER: dev.altiro.macapp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: 9DVD654W58
        CODE_SIGN_STYLE: Automatic
        # Not sandboxed: it has to read Notification Center's database (with Full Disk Access),
        # so it's distributed outside the Mac App Store, signed with Developer ID and notarized.
        ENABLE_APP_SANDBOX: NO
        # Required for notarization.
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: AltiroMac/Info.plist
      properties:
        CFBundleDisplayName: Altiro
        # Menu bar only: no Dock icon.
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSBluetoothAlwaysUsageDescription: Altiro sends your Mac notifications to your paired iPhone over Bluetooth.
